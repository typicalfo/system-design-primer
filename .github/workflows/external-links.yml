name: external-links

on:
  schedule:
    # Weekly, Monday 12:00 UTC. Not run on pull requests.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check external links
        run: python3 scripts/check_external_links.py | tee "$GITHUB_STEP_SUMMARY"
